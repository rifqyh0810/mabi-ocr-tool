<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>MABI Batch Analyzer Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--blue:#0a4d8c;--bg:#eef2f7;--ok:#1a9e57;--err:#d64545;--wait:#e0a72e}
*{box-sizing:border-box}
body{font-family:Segoe UI,Arial,sans-serif;max-width:920px;margin:20px auto;padding:0 15px;background:var(--bg);color:#222}
h2{color:var(--blue);margin-bottom:2px}
.sub{color:#666;font-size:13px;margin-top:0}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
input[type=file]{padding:10px;border:2px dashed #aac;border-radius:8px;width:100%;background:#fafcff}
button{background:var(--blue);color:#fff;border:none;padding:11px 22px;border-radius:8px;cursor:pointer;font-size:14px;margin-top:12px;font-weight:600}
button:disabled{background:#aaa;cursor:not-allowed}
button.green{background:var(--ok)}
.file-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee;font-size:13.5px}
.badge{font-size:11.5px;padding:3px 10px;border-radius:12px;color:#fff;white-space:nowrap}
.badge.wait{background:var(--wait)} .badge.ok{background:var(--ok)} .badge.err{background:var(--err)}
#progressText{color:var(--blue);font-weight:600;font-size:14px}
.note{font-size:12px;color:#888;margin-top:6px}
</style>
</head>
<body>
<h2>📄 MABI Batch Analyzer Pro</h2>
<p class="sub">Upload banyak file (PDF/JPG/DOCX) → AI ekstrak + lengkapi data via internet → download rekap Excel</p>
<div class="card">
<input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.docx" multiple>
<br><button id="processBtn">🚀 Proses & Analisa Semua File</button>
<p class="note">⚠️ Gunakan data dummy untuk uji coba. Hasil pencarian internet wajib diverifikasi manual.</p>
</div>
<div class="card" id="progressCard" style="display:none">
<p id="progressText"></p>
<div id="fileList"></div>
</div>
<div class="card" id="downloadCard" style="display:none">
<p>✅ Semua file selesai diproses.</p>
<button class="green" id="downloadBtn">⬇️ Download Rekap Excel</button>
</div>

<script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const fileInput = document.getElementById('fileInput');
const processBtn = document.getElementById('processBtn');
const progressCard = document.getElementById('progressCard');
const progressText = document.getElementById('progressText');
const fileList = document.getElementById('fileList');
const downloadCard = document.getElementById('downloadCard');
const downloadBtn = document.getElementById('downloadBtn');
let allResults = [];
let ocrWorker = null;

processBtn.addEventListener('click', async () => {
  const files = Array.from(fileInput.files);
  if (files.length === 0) { alert('Pilih file dulu.'); return; }
  processBtn.disabled = true;
  progressCard.style.display = 'block';
  downloadCard.style.display = 'none';
  fileList.innerHTML = '';
  allResults = [];
  files.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'file-row';
    row.innerHTML = `<span>${f.name}</span><span class="badge wait" id="badge-${i}">Menunggu</span>`;
    fileList.appendChild(row);
  });

  progressText.textContent = 'Menyiapkan mesin OCR (sekali saja, untuk semua file)...';
  ocrWorker = await Tesseract.createWorker('ind+eng');

  for (let i = 0; i < files.length; i++) {
    document.getElementById('badge-'+i).textContent = 'Ekstraksi...';
    try {
      const text = await extractText(files[i], i);
      document.getElementById('badge-'+i).textContent = 'Analisa + Riset AI...';
      progressText.textContent = `File ${i+1}/${files.length}: mengirim ke AI untuk dianalisa...`;
      const data = await analyzeText(text);
      data._fileName = files[i].name;
      allResults.push(data);
      document.getElementById('badge-'+i).textContent = 'Selesai';
      document.getElementById('badge-'+i).className = 'badge ok';
    } catch(err) {
      allResults.push({_fileName: files[i].name, _error: err.message});
      document.getElementById('badge-'+i).textContent = 'Gagal';
      document.getElementById('badge-'+i).className = 'badge err';
    }
    if (i < files.length - 1) await new Promise(r => setTimeout(r, 5000));
  }

  await ocrWorker.terminate();
  progressText.textContent = `Semua ${files.length} file selesai diproses.`;
  downloadCard.style.display = 'block';
  processBtn.disabled = false;
});

async function extractText(file, fileIdx) {
  const name = file.name.toLowerCase();
  if (file.type === 'application/pdf') {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    let fullText = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const textContent = await page.getTextContent();
      const pageText = textContent.items.map(it => it.str).join(' ');
      if (pageText.trim().length > 20) {
        fullText += pageText + '\n\n';
      } else {
        progressText.textContent = `File ${fileIdx+1}: dokumen hasil SCAN terdeteksi — OCR halaman ${i} dari ${pdf.numPages}, mohon tunggu...`;
        const viewport = page.getViewport({scale: 2.5});
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width; canvas.height = viewport.height;
        await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
        const { data: { text } } = await ocrWorker.recognize(canvas);
        fullText += text + '\n\n';
      }
    }
    return fullText.trim();
  } else if (name.endsWith('.docx')) {
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({arrayBuffer: buf});
    return result.value.trim();
  } else {
    progressText.textContent = `File ${fileIdx+1}: membaca gambar dengan OCR...`;
    const { data: { text } } = await ocrWorker.recognize(file);
    return text.trim();
  }
}

async function analyzeText(text) {
  const res = await fetch('/api/analyze', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json.result;
}

downloadBtn.addEventListener('click', () => {
  const wb = XLSX.utils.book_new();

  const eko = [];
  allResults.forEach((d, idx) => {
    if (d._error) { eko.push({No: idx+1, 'Nama File': d._fileName, Error: d._error}); return; }
    const id = d.identitas_debitur || {};
    const mgmt = d.management?.length ? d.management : [{}];
    const sup = d.supplier?.length ? d.supplier : [{}];
    const buy = d.buyer?.length ? d.buyer : [{}];
    const maxLen = Math.max(mgmt.length, sup.length, buy.length, 1);
    for (let i = 0; i < maxLen; i++) {
      eko.push({
        No: i===0 ? idx+1 : '',
        CIF: i===0 ? (id.cif||'') : '',
        'Nama Debitur': i===0 ? (id.nama_debitur||'') : '',
        'NPWP': i===0 ? (id.npwp||'') : '',
        'Alamat Kantor Pusat': i===0 ? (id.alamat_kantor_pusat||'') : '',
        'Regional Office': i===0 ? (d.regional_office||'') : '',
        'Total Plafon (Rp Juta)': i===0 ? (d.total_plafon_juta||'') : '',
        'Nama (Management)': mgmt[i]?.nama || '',
        'Jabatan': mgmt[i]?.jabatan || '',
        'Data Supplier': sup[i]?.nama_perusahaan || '',
        'Alamat Supplier': sup[i]?.alamat || '',
        'Sumber (Supplier)': sup[i]?.sumber_data || '',
        'Data Buyer': buy[i]?.nama_perusahaan || '',
        'Alamat Buyer': buy[i]?.alamat || '',
        'Sumber (Buyer)': buy[i]?.sumber_data || ''
      });
    }
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(eko), 'Data Ekosistem');

  const fbi = [];
  allResults.forEach((d, idx) => {
    if (d._error) return;
    const id = d.identitas_debitur || {};
    const fas = d.fasilitas_kredit?.length ? d.fasilitas_kredit : [{}];
    fas.forEach((f, i) => {
      fbi.push({
        No: i===0 ? idx+1 : '',
        'Regional Office': i===0 ? (d.regional_office||'') : '',
        'Nama Debitur': i===0 ? (id.nama_debitur||'') : '',
        'Fasilitas Pinjaman': f.jenis_fasilitas || '',
        'Status Pinjaman': f.status_pinjaman || '',
        'Tenor (Bulan)': f.tenor_bulan || '',
        'Plafon (Rp Juta)': f.plafon_juta || '',
        'Suku Bunga (%)': f.suku_bunga_persen || '',
        'Biaya Provisi (Rp Juta)': f.biaya_provisi_juta || '',
        'Biaya Administrasi (Rp Juta)': f.biaya_administrasi_juta || '',
        'Servicing Fee': f.servicing_fee || ''
      });
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(fbi), 'Data Fasilitas');

  const risk = allResults.map((d, idx) => {
    if (d._error) return {No: idx+1, 'Nama File': d._fileName, Error: d._error};
    const ag = d.agunan?.length ? d.agunan.map(a=>`${a.jenis||''} (Rp${a.nilai_juta||'-'} jt, ${a.lokasi||'-'})`).join('; ') : '';
    const fin = d.analisa_keuangan || {};
    const risiko = d.risiko_dan_legalitas || {};
    return {
      No: idx+1,
      'Nama Debitur': d.identitas_debitur?.nama_debitur || '',
      'Bentuk Badan Usaha': d.identitas_debitur?.bentuk_badan_usaha || '',
      'Jenis Kredit Diajukan': d.jenis_kredit_diajukan || '',
      'Kegunaan Kredit': d.kegunaan_kredit || '',
      'Jangka Waktu Kredit': d.jangka_waktu_kredit || '',
      'Model Bisnis': d.bisnis?.model_bisnis || '',
      'Agunan': ag,
      'Omzet (Rp Juta)': fin.omzet_juta || '',
      'Laba Bersih (Rp Juta)': fin.laba_bersih_juta || '',
      'DER': fin.der || '',
      'Status Legalitas': risiko.legalitas_status || '',
      'Group/Afiliasi': risiko.group_afiliasi || '',
      'Red Flags': risiko.red_flags || '',
      'Rekomendasi AI (Perlu Review Manusia)': d.rekomendasi_analis || '',
      'Catatan Analisa AI': d.analisa_ai || ''
    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(risk), 'Analisa & Risiko AI');

  XLSX.writeFile(wb, 'Rekap_MABI_' + new Date().toISOString().slice(0,10) + '.xlsx');
});
</script>
</body>
</html>
